<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yessenov University</title>
  <style>
    :root {
      color-scheme: light;
      --navy: #002060;
      --navy-dark: #001640;
      --navy-soft: #e9eef9;
      --ink: #172033;
      --muted: #687289;
      --line: #dfe4ed;
      --surface: #ffffff;
      --canvas: #eef1f6;
      --good: #147a4b;
      --good-soft: #e7f7ef;
      --warn: #9a5b00;
      --warn-soft: #fff4db;
      --bad: #b3261e;
      --bad-soft: #ffebe9;
      --focus: #ffb000;
      --device-width: 375px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--canvas);
      color: var(--ink);
    }

    button, select, input, textarea {
      font: inherit;
    }

    button, select, input[type="checkbox"] {
      min-height: 44px;
    }

    button, select, input, textarea {
      border-radius: 12px;
    }

    button:focus-visible,
    select:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    a:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .lab {
      display: grid;
      grid-template-columns: minmax(260px, 340px) minmax(0, 1fr);
      min-height: 100dvh;
    }

    .controls {
      position: sticky;
      top: 0;
      align-self: start;
      height: 100dvh;
      overflow: auto;
      padding: 24px;
      background: var(--surface);
      border-right: 1px solid var(--line);
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--navy);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.15;
    }

    .intro {
      margin: 8px 0 22px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .control {
      display: grid;
      gap: 7px;
      margin: 0 0 15px;
    }

    .control label,
    .control legend {
      color: #3d475b;
      font-size: 13px;
      font-weight: 750;
    }

    select {
      width: 100%;
      border: 1px solid #bdc5d2;
      padding: 0 12px;
      background: #fff;
      color: var(--ink);
    }

    .viewport-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .viewport-options button {
      border: 1px solid #bdc5d2;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
    }

    .viewport-options button[aria-pressed="true"] {
      border-color: var(--navy);
      background: var(--navy);
      color: #fff;
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 4px 0 18px;
      font-size: 14px;
      font-weight: 700;
    }

    .checkbox input {
      width: 22px;
      min-height: 22px;
      height: 22px;
      accent-color: var(--navy);
    }

    .acceptance {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .acceptance h2 {
      margin: 0 0 10px;
      font-size: 15px;
    }

    .acceptance ul {
      display: grid;
      gap: 8px;
      margin: 0;
      padding-left: 19px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .stage {
      min-width: 0;
      display: grid;
      place-items: start center;
      padding: 32px 20px 64px;
      overflow: auto;
    }

    .device-wrap {
      width: calc(var(--device-width) + 16px);
      min-width: calc(var(--device-width) + 16px);
    }

    .device-label {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin: 0 2px 10px;
      color: #556074;
      font-size: 12px;
      font-weight: 700;
    }

    .device {
      box-sizing: content-box;
      width: var(--device-width);
      height: min(760px, calc(100dvh - 104px));
      min-height: 568px;
      overflow: hidden;
      border: 8px solid #172033;
      border-radius: 32px;
      background: #f8f9fc;
      box-shadow: 0 26px 70px rgba(22, 32, 51, .2);
    }

    #app {
      width: 100%;
      height: 100%;
    }

    .phone {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      width: 100%;
      height: 100%;
      min-width: 0;
      background: #f7f8fb;
    }

    .phone.keyboard-open {
      grid-template-rows: auto minmax(0, 1fr) auto 196px;
    }

    .phone-header {
      padding: max(12px, env(safe-area-inset-top)) 14px 12px;
      background: var(--navy);
      color: #fff;
    }

    .statusbar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 11px;
      opacity: .85;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) 44px;
      align-items: center;
      gap: 6px;
    }

    .icon-button {
      display: inline-grid;
      place-items: center;
      width: 44px;
      min-height: 44px;
      padding: 0;
      border: 0;
      border-radius: 12px;
      background: rgba(255, 255, 255, .12);
      color: inherit;
      cursor: pointer;
    }

    .toolbar h2 {
      min-width: 0;
      margin: 0;
      overflow-wrap: anywhere;
      font-size: 17px;
      line-height: 1.2;
      text-align: center;
    }

    .badge-dot {
      position: relative;
    }

    .badge-dot::after {
      content: "3";
      position: absolute;
      top: 3px;
      right: 2px;
      min-width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      padding: 0 4px;
      border: 2px solid var(--navy);
      border-radius: 10px;
      background: #ffcf56;
      color: #2d2100;
      font-size: 10px;
      font-weight: 900;
    }

    .phone-body {
      min-width: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 14px 14px 22px;
    }

    .phone-footer {
      display: grid;
      gap: 8px;
      padding: 10px 14px max(12px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, .98);
    }

    .keyboard-preview {
      display: none;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 5px;
      align-content: center;
      padding: 12px 8px max(10px, env(safe-area-inset-bottom));
      border-top: 1px solid #abb3c0;
      background: #cbd0d8;
    }

    .phone.keyboard-open .keyboard-preview {
      display: grid;
    }

    .keyboard-key {
      height: 32px;
      border-radius: 6px;
      background: #fff;
      box-shadow: 0 1px 1px rgba(0, 0, 0, .15);
    }

    .keyboard-key.wide {
      grid-column: span 5;
    }

    .stack { display: grid; gap: 12px; }
    .row { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .between { justify-content: space-between; }
    .grow { min-width: 0; flex: 1; }

    .section-title {
      margin: 3px 0 0;
      font-size: 15px;
      line-height: 1.3;
    }

    .muted {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .card {
      min-width: 0;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 3px 12px rgba(23, 32, 51, .04);
      overflow-wrap: anywhere;
    }

    .card h3 {
      margin: 0 0 5px;
      font-size: 15px;
      line-height: 1.3;
    }

    .card p { margin: 0; }

    .meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
      min-height: 28px;
      padding: 5px 9px;
      border-radius: 999px;
      background: var(--navy-soft);
      color: var(--navy);
      font-size: 11px;
      font-weight: 800;
      line-height: 1.2;
    }

    .chip.good { background: var(--good-soft); color: var(--good); }
    .chip.warn { background: var(--warn-soft); color: var(--warn); }
    .chip.bad { background: var(--bad-soft); color: var(--bad); }

    .notice {
      padding: 12px;
      border: 1px solid #d8b35b;
      border-radius: 14px;
      background: var(--warn-soft);
      color: #684000;
      font-size: 13px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .notice.error {
      border-color: #efaaa5;
      background: var(--bad-soft);
      color: #7b1914;
    }

    .notice.info {
      border-color: #aabbe1;
      background: var(--navy-soft);
      color: #18366f;
    }

    .notice.good {
      border-color: #8ed1ae;
      background: var(--good-soft);
      color: #0c623a;
    }

    .button {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--navy);
      padding: 10px 14px;
      background: var(--navy);
      color: #fff;
      font-weight: 800;
      line-height: 1.25;
      cursor: pointer;
      overflow-wrap: anywhere;
    }

    .button.secondary {
      background: #fff;
      color: var(--navy);
    }

    .button.danger {
      border-color: var(--bad);
      background: #fff;
      color: var(--bad);
    }

    .button:disabled {
      border-color: #b8bfcc;
      background: #d7dbe3;
      color: #626b7a;
      cursor: not-allowed;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      font-size: 13px;
      font-weight: 800;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      min-width: 0;
      border: 1px solid #b8c0ce;
      padding: 11px 12px;
      background: #fff;
      color: var(--ink);
    }

    .field textarea {
      min-height: 88px;
      resize: vertical;
    }

    .field [aria-invalid="true"] { border-color: var(--bad); }

    .field-error {
      margin: 0;
      color: var(--bad);
      font-size: 12px;
      line-height: 1.35;
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .segmented button {
      min-width: 0;
      border: 1px solid #b8c0ce;
      padding: 8px;
      background: #fff;
      color: var(--ink);
      font-size: 12px;
      font-weight: 750;
      overflow-wrap: anywhere;
    }

    .segmented button.active {
      border-color: var(--navy);
      background: var(--navy-soft);
      color: var(--navy);
    }

    .camera {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 260px;
      overflow: hidden;
      border-radius: 20px;
      background:
        radial-gradient(circle at 30% 24%, rgba(255,255,255,.12), transparent 28%),
        linear-gradient(145deg, #27354c, #0c1424);
      color: #fff;
    }

    .camera::before {
      content: "";
      width: 178px;
      height: 178px;
      border: 3px solid #ffcf56;
      border-radius: 20px;
      box-shadow: 0 0 0 999px rgba(0, 0, 0, .18);
    }

    .camera-copy {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      text-align: center;
      font-size: 13px;
      line-height: 1.35;
    }

    .progress {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: #e1e5ed;
    }

    .progress > span {
      display: block;
      width: 64%;
      height: 100%;
      border-radius: inherit;
      background: var(--navy);
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .result-grid button {
      min-width: 0;
      min-height: 56px;
      border: 1px solid #bdc5d2;
      padding: 9px;
      background: #fff;
      text-align: left;
      font-size: 12px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .result-grid button.active {
      border: 2px solid var(--navy);
      background: var(--navy-soft);
      color: var(--navy);
    }

    .skeleton {
      height: 14px;
      border-radius: 8px;
      background: linear-gradient(90deg, #e6e9ef 20%, #f6f7f9 45%, #e6e9ef 70%);
      background-size: 220% 100%;
      animation: shimmer 1.2s infinite linear;
    }

    .skeleton.short { width: 58%; }
    .skeleton.tall { height: 76px; }

    @keyframes shimmer {
      to { background-position: -220% 0; }
    }

    .empty {
      display: grid;
      place-items: center;
      min-height: 300px;
      padding: 28px 12px;
      text-align: center;
    }

    .empty-icon {
      display: grid;
      place-items: center;
      width: 68px;
      height: 68px;
      margin-bottom: 14px;
      border-radius: 22px;
      background: var(--navy-soft);
      color: var(--navy);
      font-size: 30px;
    }

    .divider {
      height: 1px;
      background: var(--line);
    }

    .notification-list {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .notification-link {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      margin-top: 8px;
      color: var(--navy);
      font-size: 13px;
      font-weight: 800;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 760px) {
      .lab { display: block; }
      .controls {
        position: static;
        width: 100%;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .stage { justify-content: start; overflow-x: auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div class="lab">
    <aside class="controls" aria-labelledby="lab-title">
      <p class="eyebrow" data-copy="lab.eyebrow"></p>
      <h1 id="lab-title" data-copy="lab.title"></h1>
      <p class="intro" data-copy="lab.intro"></p>

      <div class="control">
        <label for="screen" data-copy="control.screen"></label>
        <select id="screen"></select>
      </div>
      <div class="control">
        <label for="state" data-copy="control.state"></label>
        <select id="state"></select>
      </div>
      <div class="control">
        <label for="role" data-copy="control.role"></label>
        <select id="role"></select>
      </div>
      <div class="control">
        <label for="language" data-copy="control.language"></label>
        <select id="language">
          <option value="ru">Русский</option>
          <option value="kk">Қазақша</option>
          <option value="en">English</option>
        </select>
      </div>
      <div class="control">
        <span id="viewport-label" data-copy="control.viewport"></span>
        <div class="viewport-options" aria-labelledby="viewport-label">
          <button type="button" data-width="320">320</button>
          <button type="button" data-width="375">375</button>
          <button type="button" data-width="430">430</button>
        </div>
      </div>
      <label class="checkbox">
        <input id="long-copy" type="checkbox">
        <span data-copy="control.long"></span>
      </label>
      <label class="checkbox">
        <input id="keyboard-open" type="checkbox">
        <span data-copy="control.keyboard"></span>
      </label>

      <section class="acceptance">
        <h2 data-copy="accept.title"></h2>
        <ul>
          <li data-copy="accept.overflow"></li>
          <li data-copy="accept.touch"></li>
          <li data-copy="accept.locale"></li>
          <li data-copy="accept.keyboard"></li>
          <li data-copy="accept.privacy"></li>
          <li data-copy="accept.a11y"></li>
        </ul>
      </section>
    </aside>

    <main class="stage">
      <div class="device-wrap">
        <div class="device-label">
          <span id="device-summary"></span>
          <span data-copy="lab.prototype"></span>
        </div>
        <div class="device">
          <div id="app" aria-live="polite"></div>
        </div>
      </div>
    </main>
  </div>

        "notifications.adminQueueResolved": "The shared-queue decision was closed.",
        "notifications.confirmed": "The inspection was confirmed.",
        "notifications.unread": "Unread",
        "notifications.read": "Read",
        "notifications.markAll": "Mark visible items as read",
        "notifications.queue": "Pending decisions",
        "notifications.confirmResult": "Confirm result",
        "notifications.dispute": "Dispute",
        "notifications.disputeComment": "Why you disagree with the result",
        "notifications.disputePhoto": "Add photo (optional)",
        "notifications.sendDispute": "Submit dispute",
        "notifications.stale": "The action is no longer available. Current status is shown.",
        "notifications.reason": "Reason for the administrator decision",
        "notifications.reasonHint": "The reason is stored in the audit and is not shown in previews.",
        "notifications.resolve": "Close decision",
        "notifications.adminConflict": "Another administrator already closed this decision. Data was refreshed."
      }
    };

    const screens = {
      inspections: ["loading", "empty", "active", "offline", "error"],
      create: ["default", "validation", "submitting", "error", "success"],
      context: ["select", "emptyRoom", "mismatch", "progress", "duplicate"],
      scanner: ["start", "pending", "denied", "unavailable", "camera", "manual", "resolving", "offline", "duplicate"],
      resolver: ["building", "room", "item", "invalid", "unknown", "unissued", "ambiguous", "revoked", "inactive", "wrongContext", "notAccessible"],
      result: ["default", "moved", "missing", "photoError", "conflict", "saved"],
      newItem: ["form", "validation", "submitting", "photoError", "success"],
      summary: ["progress", "blocked", "confirmed", "awaiting", "readonly", "disputed"],
      responsibility: ["free", "occupied", "requested", "existing", "confirm", "rejected", "conflict"],
      notifications: ["loading", "empty", "feed", "decisions", "disputeForm", "stale", "adminReason", "adminConflict"]
    };

    const access = {
      inspections: ["warehouse", "admin"],
      create: ["warehouse", "admin"],
      context: ["warehouse", "admin"],
      scanner: ["warehouse", "employee", "admin"],
      resolver: ["warehouse", "employee", "admin"],
      result: ["warehouse", "admin"],
      newItem: ["warehouse", "admin"],
      summary: ["warehouse", "admin"],
      responsibility: ["employee", "admin"],
      notifications: ["warehouse", "employee", "admin"]
    };

    const model = {
      screen: "inspections",
      state: "active",
      role: "warehouse",
      language: "ru",
      width: "375",
      long: false,
      keyboard: false,
      numberType: "temporary",
      selectedResult: null
    };

    const $ = (selector) => document.querySelector(selector);
    const t = (key) => copy[model.language][key] || copy.ru[key] || key;
    const itemName = () => t(model.long ? "data.itemLong" : "data.item");
    const icon = (value) => `<span aria-hidden="true">${value}</span>`;
    const chip = (label, tone = "") => `<span class="chip ${tone}">${label}</span>`;
    const button = (label, kind = "", disabled = false) =>
      `<button class="button ${kind}" type="button" ${disabled ? "disabled" : ""}>${label}</button>`;
    const notice = (text, tone = "") => `<div class="notice ${tone}" role="${tone === "error" ? "alert" : "status"}">${text}</div>`;
    const field = (label, value = "", options = {}) => {
      const id = options.id || "field-" + Math.random().toString(36).slice(2);
      const errorId = id + "-error";
      return `<div class="field">
        <label for="${id}">${label}</label>
        <input id="${id}" value="${value}" placeholder="${options.placeholder || ""}"
          ${options.required ? 'required aria-required="true"' : ""}
          ${options.invalid ? `aria-invalid="true" aria-describedby="${errorId}"` : ""}>
        ${options.invalid ? `<p class="field-error" id="${errorId}">${options.error || t("common.required")}</p>` : ""}
      </div>`;
    };
    const selectField = (label, id, invalid = false) => {
      const errorId = `${id}-error`;
      return `<div class="field">
        <label for="${id}">${label}</label>
        <select id="${id}" required aria-required="true"
          ${invalid ? `aria-invalid="true" aria-describedby="${errorId}"` : ""}>
          ${invalid ? `<option value="" selected>${t("create.technicianPlaceholder")}</option>` : ""}
          <option value="employee-1">Demo Employee 1</option>
          <option value="employee-2">Demo Employee 2</option>
        </select>
        ${invalid ? `<p class="field-error" id="${errorId}">${t("common.required")}</p>` : ""}
      </div>`;
    };
    const textareaField = (label, id, options = {}) => {
      const errorId = `${id}-error`;
      return `<div class="field">
        <label for="${id}">${label}</label>
        <textarea id="${id}" ${options.required ? 'required aria-required="true"' : ""}
          ${options.invalid ? `aria-invalid="true" aria-describedby="${errorId}"` : ""}></textarea>
        ${options.invalid ? `<p class="field-error" id="${errorId}">${options.error || t("common.required")}</p>` : ""}
      </div>`;
    };
    const adminReasonField = (id) => model.role === "admin"
      ? `${textareaField(t("common.adminReason"), id, { required: true, invalid: true })}
         <p class="muted">${t("common.adminReasonHint")}</p>`
      : "";

    function shell(title, body, footer = "") {
      return `<div class="phone ${model.keyboard ? "keyboard-open" : ""}">
        <header class="phone-header">
          <div class="statusbar"><span>14:35</span><span>4G · 82%</span></div>
          <div class="toolbar">
            <button class="icon-button" type="button" aria-label="${t("common.back")}">${icon("←")}</button>
            <h2>${title}</h2>
            <button class="icon-button badge-dot" type="button" aria-label="${t("common.notifications")}">${icon("♢")}</button>
          </div>
        </header>
        <section class="phone-body" aria-label="${title}"><div class="stack">${body}</div></section>
        ${footer ? `<footer class="phone-footer">${footer}</footer>` : "<div></div>"}
        <div class="keyboard-preview" aria-hidden="true">
          ${Array.from({ length: 20 }, (_, index) => `<span class="keyboard-key ${index >= 18 ? "wide" : ""}"></span>`).join("")}
        </div>
      </div>`;
    }

    function renderAccessDenied() {
      return shell(t("common.noAccess"), `
        <div class="empty">
          <div>
            <div class="empty-icon" aria-hidden="true">⊘</div>
            <h3>${t("common.noAccess")}</h3>
            <p class="muted">${t("common.noAccessHint")}</p>
          </div>
        </div>
      `, button(t("common.openHome"), "secondary"));
    }

    function renderInspections() {
      const state = model.state;
      if (state === "loading") return shell(t("inspections.title"), `
        <div class="card stack" aria-busy="true"><p class="sr-only" role="status">${t("common.loading")}</p><div class="skeleton short"></div><div class="skeleton"></div><div class="skeleton tall"></div></div>
        <div class="card stack" aria-busy="true"><div class="skeleton short"></div><div class="skeleton"></div><div class="skeleton tall"></div></div>
      `);
      if (state === "empty") return shell(t("inspections.title"), `
        <div class="empty"><div><div class="empty-icon" aria-hidden="true">▣</div><h3>${t("inspections.empty")}</h3><p class="muted">${t("inspections.emptyHint")}</p></div></div>
      `, button(t("inspections.create")));
      const message = state === "offline" ? notice(t("common.offline"), "error") :
        state === "error" ? notice(t("common.serverError"), "error") : "";
      return shell(t("inspections.title"), `
        ${message}
        <article class="card">
          <div class="row between"><div class="grow"><h3>${t("inspections.active")}</h3><p class="meta">${t("data.date")}</p></div>${chip(t("inspections.draft"), "warn")}</div>
          <div class="progress" aria-label="${t("inspections.progress")}"><span></span></div>
          <p class="meta" style="margin-top:8px">${t("inspections.progress")}</p>
        </article>
        <article class="card">
          <div class="row between"><div class="grow"><h3>${t("inspections.completedName")}</h3><p class="meta">${t("data.date")}</p></div>${chip(t("inspections.confirmed"), "good")}</div>
        </article>
      `, state === "error" ? button(t("common.retry")) : button(t("inspections.create")));
    }

    function renderCreate() {
      const invalid = model.state === "validation";
      const submitting = model.state === "submitting";
      const message = model.state === "error" ? notice(t("create.serverError"), "error") :
        model.state === "success" ? notice(t("create.success"), "good") : "";
      return shell(t("create.title"), `
        <div class="stack" ${submitting ? 'aria-busy="true"' : ""}>
          ${submitting ? `<p class="sr-only" role="status">${t("common.saving")}</p>` : ""}
          ${message}
          ${model.role === "admin" ? notice(t("create.adminHint"), "info") : ""}
          ${field(t("create.label"), invalid ? "A" : "", { id: "inspection-name", placeholder: t("create.placeholder"), invalid, required: true, error: t("create.error") })}
          ${model.role === "admin"
            ? selectField(t("create.technician"), "inspection-technician", invalid)
            : ""}
          <p class="muted">0 / 120</p>
        </div>
      `, button(submitting ? t("common.saving") : t("create.submit"), "", submitting));
    }

    function renderContext() {
      let message = "";
      if (model.state === "emptyRoom") message = notice(t("context.empty"), "info");
      if (model.state === "mismatch") message = notice(t("context.mismatch"), "error");
      if (model.state === "duplicate") message = notice(t("context.duplicate"), "info");
      return shell(t("context.title"), `
        ${message}
        <div class="card stack">
          <div><p class="meta">${t("context.building")}</p><h3>${t("data.building")}</h3></div>
          <div class="divider"></div>
          <div><p class="meta">${t("context.room")}</p><h3>${t("data.room")}</h3></div>
          ${model.state === "progress" ? `<div class="progress"><span></span></div><p class="meta">${t("context.progress")}</p>` : ""}
        </div>
        <div class="segmented">
          <button type="button">${t("context.choose")}</button>
          <button type="button">${t("context.scanBuilding")}</button>
        </div>
        ${adminReasonField("context-admin-reason")}
      `, model.state === "emptyRoom"
        ? button(t("context.emptyAction"), "", model.role === "admin")
        : `${button(t("context.scanRoom"), "", model.role === "admin")}${button(t("common.continue"), "secondary")}`);
    }

    function renderScanner() {
      const state = model.state;
      if (state === "camera") return shell(t("scanner.title"), `
        <div class="camera" role="img" aria-label="${t("scanner.aim")}"><p class="camera-copy">${t("scanner.aim")}</p></div>
      `, button(t("common.manual"), "secondary"));
      if (state === "manual") return shell(t("scanner.title"), `
        ${field(t("scanner.codeLabel"), "YUQ1:01J4Z3R2C8M5N7P9Q1S6T0V4X2", { id: "manual-code", placeholder: t("scanner.codePlaceholder") })}
      `, button(t("scanner.resolve")));
      if (state === "resolving") return shell(t("scanner.title"), `
        <div class="card stack" aria-busy="true"><div class="skeleton tall"></div><p class="muted" role="status">${t("scanner.resolving")}</p></div>
      `, button(t("scanner.resolving"), "", true));
      const message = {
        pending: `<div aria-busy="true">${notice(t("scanner.pending"), "info")}</div>`,
        denied: notice(`${t("scanner.denied")}. ${t("scanner.deniedHint")}`, "error"),
        unavailable: notice(t("scanner.unavailable"), "error"),
        offline: notice(t("scanner.offline"), "error"),
        duplicate: notice(t("scanner.duplicate"), "info")
      }[state] || "";
      return shell(t("scanner.title"), `
        ${message}
        <div class="empty"><div><div class="empty-icon" aria-hidden="true">▦</div><h3>${t("scanner.startTitle")}</h3><p class="muted">${t("scanner.startHint")}</p></div></div>
      `, `${button(t("scanner.start"), "", state === "pending")}${button(t("common.manual"), "secondary")}`);
    }

    function renderResolver() {
      const sensitiveEmployeeStates = ["building", "room", "unknown", "unissued", "ambiguous", "revoked", "inactive", "wrongContext"];
      const effectiveState =
        model.role === "employee" && sensitiveEmployeeStates.includes(model.state)
          ? "notAccessible"
          : model.state;
      const key = `resolver.${effectiveState}`;
      const ok = ["building", "room", "item"].includes(effectiveState);
      const symbol = ok ? "✓" : "!";
      const tone = ok ? "good" : "error";
      let footer;
      if (ok) {
        footer = button(t(effectiveState === "item" ? "resolver.open" : "common.continue"));
      } else if (effectiveState === "unknown" && ["warehouse", "admin"].includes(model.role)) {
        footer = `<button class="button" type="button" data-screen="newItem" data-state="form">${t("resolver.createItem")}</button>${button(t("common.retry"), "secondary")}`;
      } else {
        footer = `${button(t("common.retry"))}${button(t("common.manual"), "secondary")}`;
      }
      return shell(t("resolver.title"), `
        <div class="empty"><div>
          <div class="empty-icon" aria-hidden="true">${symbol}</div>
          ${notice(t(key), tone)}
        </div></div>
      `, footer);
    }

    function resultOptions(active, allowed = ["present", "missing", "moved", "broken", "unknown"]) {
      return `<div class="result-grid" role="group" aria-label="${t("result.choose")}">
        ${allowed.map((key) =>
          `<button type="button" class="${active === key ? "active" : ""}" aria-pressed="${active === key}" data-result="${key}">${t(`result.${key}`)}</button>`).join("")}
      </div>`;
    }

    function renderResult() {
      const active = model.selectedResult ||
        (model.state === "moved" ? "moved" : model.state === "missing" ? "missing" : "present");
      const stateNotice = {
        moved: notice(t("result.movedWarning")),
        missing: notice(t("result.missingHint"), "info"),
        photoError: notice(t("result.photoError"), "error"),
        conflict: notice(t("result.conflict"), "error"),
        saved: notice(t("result.saved"), "good")
      }[model.state] || "";
      return shell(t("result.title"), `
        ${stateNotice}
        <article class="card"><h3>${itemName()}</h3><p class="meta">${t("data.inventory")}</p><p class="meta">${t("result.registryRoom")}</p>${model.state === "moved" ? `<p class="meta">${t("result.actualRoom")}</p>` : ""}</article>
        <h3 class="section-title">${t("result.choose")}</h3>
        ${resultOptions(active)}
        <div class="field"><label for="result-comment">${t("result.comment")}</label><textarea id="result-comment" placeholder="${t("result.commentPlaceholder")}"></textarea></div>
        ${button(t("result.photo"), "secondary")}
        ${adminReasonField("result-admin-reason")}
      `, button(t("common.save"), "", model.role === "admin"));
    }

    function renderNewItem() {
      const invalid = model.state === "validation";
      const submitting = model.state === "submitting";
      const stateNotice = {
        validation: notice(t("new.validation"), "error"),
        photoError: notice(t("new.photoError"), "error"),
        success: notice(
          t(model.numberType === "official" ? "new.successOfficial" : "new.successTemporary"),
          "good",
        )
      }[model.state] || notice(t("new.hint"), "info");
      return shell(t("new.title"), `
        <div class="stack" ${submitting ? 'aria-busy="true"' : ""}>
          ${submitting ? `<p class="sr-only" role="status">${t("common.saving")}</p>` : ""}
          ${stateNotice}
          ${field(t("new.name"), invalid ? "" : itemName(), { id: "new-name", invalid, required: true })}
          <h3 class="section-title">${t("new.numberType")}</h3>
          <div class="segmented" role="group" aria-label="${t("new.numberType")}">
            <button type="button" class="${model.numberType === "official" ? "active" : ""}" aria-pressed="${model.numberType === "official"}" data-number-type="official">${t("new.official")}</button>
            <button type="button" class="${model.numberType === "temporary" ? "active" : ""}" aria-pressed="${model.numberType === "temporary"}" data-number-type="temporary">${t("new.temporary")}</button>
          </div>
          ${model.numberType === "official"
            ? field(t("new.number"), "INV-2026-0042", { id: "official-number", required: true })
            : `<p class="muted">${t("new.tmp")}</p>`}
          <h3 class="section-title">${t("new.result")}</h3>
          ${resultOptions(
            ["present", "broken", "unknown"].includes(model.selectedResult) ? model.selectedResult : "present",
            ["present", "broken", "unknown"],
          )}
          ${button(t("result.photo"), "secondary")}
          ${adminReasonField("new-item-admin-reason")}
        </div>
      `, button(
        submitting ? t("common.saving") : t("new.submit"),
        "",
        submitting || model.role === "admin",
      ));
    }

    function renderSummary() {
      const stateNotice = {
        progress: notice(t("summary.unprocessed"), "info"),
        blocked: notice(t("summary.blocked"), "error"),
        confirmed: notice(t("summary.confirmed"), "good"),
        awaiting: notice(t("summary.awaiting")),
        readonly: notice(t("summary.readonly"), "info"),
        disputed: notice(t("summary.disputed"), "error")
      }[model.state];
      return shell(t("summary.title"), `
        ${stateNotice}
        <div class="card stack">
          <div class="row between"><h3>${t("data.building")}</h3>${chip("2 / 4", model.state === "confirmed" ? "good" : "warn")}</div>
          <div class="progress"><span></span></div>
          <p class="meta">${t("summary.progress")}</p>
        </div>
        <div class="card"><h3>${t("data.room")}</h3><p class="meta">${t("context.progress")}</p></div>
        ${adminReasonField("summary-admin-reason")}
      `, model.state === "disputed"
        ? button(t("summary.recheck"), "", model.role === "admin")
        : button(
            t("summary.complete"),
            "",
            model.role === "admin" || ["blocked", "readonly", "confirmed", "awaiting"].includes(model.state),
          ));
    }

    function renderResponsibility() {
      const state = model.state;
      if (model.role === "admin") {
        return shell(t("responsibility.title"), `
          ${notice(t("responsibility.adminHint"), "info")}
          <article class="card"><h3>${itemName()}</h3><p class="meta">${t("data.inventory")}</p><p class="meta">${t("data.room")}</p></article>
          ${selectField(t("responsibility.adminEmployee"), "admin-new-responsible")}
          ${adminReasonField("responsibility-admin-reason")}
        `, button(t("responsibility.adminApply"), "", true));
      }
      const messages = {
        free: notice(t("responsibility.free"), "info"),
        occupied: notice(`${t("responsibility.occupied")} ${t("responsibility.hidden")}`, "info"),
        requested: notice(t("responsibility.requested"), "good"),
        existing: notice(t("responsibility.existing"), "error"),
        confirm: notice(t("responsibility.confirm")),
        rejected: notice(t("responsibility.rejected"), "info"),
        conflict: notice(t("responsibility.conflict"), "error")
      };
      let footer = button(t("common.close"), "secondary");
      if (state === "free") footer = button(t("responsibility.accept"));
      if (state === "occupied") footer = button(t("responsibility.request"));
      if (state === "confirm") footer = `${button(t("responsibility.confirmAction"))}${button(t("responsibility.reject"), "danger")}`;
      if (state === "requested") footer = button(t("common.cancel"), "danger");
      return shell(t("responsibility.title"), `
        ${messages[state]}
        <article class="card"><h3>${itemName()}</h3><p class="meta">${t("data.inventory")}</p><p class="meta">${t("data.room")}</p></article>
      `, footer);
    }

    function notificationCard(text, unread = false, targetScreen = "notifications", targetState = "stale") {
      const href = `?${new URLSearchParams({
        screen: targetScreen,
        state: targetState,
        role: model.role,
        lang: model.language,
        width: model.width,
      }).toString()}`;
      return `<li class="card">
        <div class="row between"><div class="grow"><h3>${text}</h3><p class="meta">${t("data.date")}</p></div>${chip(t(unread ? "notifications.unread" : "notifications.read"), unread ? "warn" : "")}</div>
        <a class="notification-link" href="${href}">${t("notifications.open")}</a>
      </li>`;
    }
    const notificationList = (cards) =>
      `<ul class="notification-list" aria-label="${t("notifications.title")}">${cards.join("")}</ul>`;

    function renderNotifications() {
      const state = model.state;
      if (state === "loading") return shell(t("notifications.title"), `
        <div class="card stack" aria-busy="true"><p class="sr-only" role="status">${t("common.loading")}</p><div class="skeleton short"></div><div class="skeleton"></div><div class="skeleton tall"></div></div>
      `);
      if (state === "empty") return shell(t("notifications.title"), `
        <div class="empty"><div><div class="empty-icon" aria-hidden="true">◇</div><h3>${t("notifications.empty")}</h3><p class="muted">${t("notifications.emptyHint")}</p></div></div>
      `);
      if (state === "feed") {
        const roleFeed = model.role === "warehouse"
          ? notificationList([
              notificationCard(t("notifications.recheck"), true, "summary", "disputed"),
              notificationCard(t("notifications.resolvedByAdmin"), false),
              notificationCard(t("notifications.adminQueueResolved"), false),
              notificationCard(t("notifications.confirmed"), false, "summary", "confirmed"),
            ])
          : model.role === "admin"
            ? notificationList([
                notificationCard(t("notifications.adminQueue"), true, "notifications", "decisions"),
              ])
            : notificationList([
                notificationCard(t("notifications.transfer"), true, "responsibility", "confirm"),
                notificationCard(t("notifications.transferConfirmed"), false, "responsibility", "requested"),
                notificationCard(t("notifications.transferRejected"), false, "responsibility", "rejected"),
                notificationCard(t("notifications.transferCancelled"), false),
                notificationCard(t("notifications.transferOverridden"), false),
                notificationCard(t("notifications.decision"), true, "notifications", "decisions"),
                notificationCard(t("notifications.recheckRequested"), true, "notifications", "decisions"),
                notificationCard(t("notifications.closedPresent"), false),
                notificationCard(t("notifications.resolvedByAdmin"), false),
              ]);
        return shell(t("notifications.title"), roleFeed, button(t("notifications.markAll"), "secondary"));
      }
      if (state === "decisions") {
        const adminQueue = model.role === "admin";
        return shell(t("notifications.queue"), `
          ${notice(t(adminQueue ? "notifications.adminQueue" : "notifications.decision"), "info")}
          <article class="card"><h3>${itemName()}</h3><p class="meta">${t("data.inventory")}</p><p class="meta">${t("data.date")}</p></article>
        `, adminQueue
          ? button(t("notifications.review"))
          : `${button(t("notifications.confirmResult"))}<button class="button danger" type="button" data-screen="notifications" data-state="disputeForm">${t("notifications.dispute")}</button>`);
      }
      if (state === "disputeForm") return shell(t("notifications.dispute"), `
        <article class="card"><h3>${itemName()}</h3><p class="meta">${t("data.inventory")}</p><p class="meta">${t("data.date")}</p></article>
        ${textareaField(t("notifications.disputeComment"), "dispute-comment", {
          required: true,
          invalid: true,
          error: t("common.required"),
        })}
        ${button(t("notifications.disputePhoto"), "secondary")}
      `, button(t("notifications.sendDispute"), "", true));
      if (state === "adminReason") return shell(t("notifications.queue"), `
        ${textareaField(t("notifications.reason"), "admin-reason", { required: true, invalid: true, error: t("common.required") })}
        <p class="muted">${t("notifications.reasonHint")}</p>
      `, button(t("notifications.resolve"), "", true));
      const message = state === "adminConflict" ? t("notifications.adminConflict") : t("notifications.stale");
      return shell(t("notifications.queue"), `
        ${notice(message, "error")}
        <article class="card"><h3>${itemName()}</h3><p class="meta">${t("data.inventory")}</p></article>
      `, button(t("common.refresh")));
    }

    const renderers = {
      inspections: renderInspections,
      create: renderCreate,
      context: renderContext,
      scanner: renderScanner,
      resolver: renderResolver,
      result: renderResult,
      newItem: renderNewItem,
      summary: renderSummary,
      responsibility: renderResponsibility,
      notifications: renderNotifications
    };

    function canRenderCurrentState() {
      if (!access[model.screen].includes(model.role)) return false;
      if (model.screen === "notifications" && ["adminReason", "adminConflict"].includes(model.state) && model.role !== "admin") return false;
      if (model.screen === "notifications" && model.state === "disputeForm" && model.role !== "employee") return false;
      if (model.screen === "notifications" && model.state === "decisions" && !["employee", "admin"].includes(model.role)) return false;
      return true;
    }

    function renderControls() {
      document.documentElement.lang = model.language;
      document.title = t("lab.title");
      document.querySelectorAll("[data-copy]").forEach((node) => {
        node.textContent = t(node.dataset.copy);
      });

      const screenSelect = $("#screen");
      screenSelect.innerHTML = Object.keys(screens).map((key) =>
        `<option value="${key}" ${key === model.screen ? "selected" : ""}>${t(`screen.${key}`)}</option>`).join("");

      const stateSelect = $("#state");
      stateSelect.innerHTML = screens[model.screen].map((key) =>
        `<option value="${key}" ${key === model.state ? "selected" : ""}>${t(`state.${key}`)}</option>`).join("");

      const roleSelect = $("#role");
      roleSelect.innerHTML = ["warehouse", "employee", "admin", "owner"].map((key) =>
        `<option value="${key}" ${key === model.role ? "selected" : ""}>${t(`role.${key}`)}</option>`).join("");

      $("#language").value = model.language;
      $("#long-copy").checked = model.long;
      $("#keyboard-open").checked = model.keyboard;
      document.querySelectorAll("[data-width]").forEach((node) => {
        node.setAttribute("aria-pressed", String(node.dataset.width === model.width));
      });
      document.documentElement.style.setProperty("--device-width", `${model.width}px`);
      $("#device-summary").textContent = `${model.width} px · ${t(`role.${model.role}`)} · ${model.language.toUpperCase()}`;
    }

    function render() {
      renderControls();
      const allowed = canRenderCurrentState();
      $("#app").innerHTML = allowed ? renderers[model.screen]() : renderAccessDenied();
      const query = new URLSearchParams({
        screen: model.screen,
        state: model.state,
        role: model.role,
        lang: model.language,
        width: model.width,
        long: model.long ? "1" : "0",
        keyboard: model.keyboard ? "1" : "0",
        number: model.numberType
      });
      history.replaceState(null, "", `?${query.toString()}`);
    }

    function hydrateFromQuery() {
      const query = new URLSearchParams(location.search);
      if (screens[query.get("screen")]) {
        model.screen = query.get("screen");
        model.state = screens[model.screen][0];
      }
      const state = query.get("state");
      if (screens[model.screen].includes(state)) model.state = state;
      if (["warehouse", "employee", "admin", "owner"].includes(query.get("role"))) model.role = query.get("role");
      if (copy[query.get("lang")]) model.language = query.get("lang");
      if (["320", "375", "430"].includes(query.get("width"))) model.width = query.get("width");
      model.long = query.get("long") === "1";
      model.keyboard = query.get("keyboard") === "1";
      if (["official", "temporary"].includes(query.get("number"))) model.numberType = query.get("number");
    }

    $("#screen").addEventListener("change", (event) => {
      model.screen = event.target.value;
      model.state = screens[model.screen][0];
      model.selectedResult = null;
      render();
    });
    $("#state").addEventListener("change", (event) => {
      model.state = event.target.value;
      render();
    });
    $("#role").addEventListener("change", (event) => {
      model.role = event.target.value;
      render();
    });
    $("#language").addEventListener("change", (event) => {
      model.language = event.target.value;
      render();
    });
    $("#long-copy").addEventListener("change", (event) => {
      model.long = event.target.checked;
      render();
    });
    $("#keyboard-open").addEventListener("change", (event) => {
      model.keyboard = event.target.checked;
      render();
    });
    $("#app").addEventListener("click", (event) => {
      const target = event.target.closest("[data-screen], [data-number-type], [data-result]");
      if (!target) return;
      let focusSelector = null;
      if (target.dataset.screen && screens[target.dataset.screen]) {
        model.screen = target.dataset.screen;
        model.state = screens[model.screen].includes(target.dataset.state) ? target.dataset.state : screens[model.screen][0];
        model.selectedResult = null;
      }
      if (["official", "temporary"].includes(target.dataset.numberType)) {
        model.numberType = target.dataset.numberType;
        focusSelector = `[data-number-type="${model.numberType}"]`;
      }
      if (["present", "missing", "moved", "broken", "unknown"].includes(target.dataset.result)) {
        model.selectedResult = target.dataset.result;
        focusSelector = `[data-result="${model.selectedResult}"]`;
      }
      render();
      if (focusSelector) document.querySelector(focusSelector)?.focus();
    });
    document.querySelectorAll("[data-width]").forEach((node) => {
      node.addEventListener("click", () => {
        model.width = node.dataset.width;
        render();
      });
    });

    hydrateFromQuery();
    render();
  </script>
</body>
</html>
