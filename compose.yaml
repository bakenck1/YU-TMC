name: yu-inventory

services:
  postgres-development:
    image: postgres:17-alpine
    profiles: ["development"]
    environment:
      POSTGRES_DB: yu_inventory_dev
      POSTGRES_PASSWORD: local-development-password
      POSTGRES_USER: yu_inventory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yu_inventory -d yu_inventory_dev"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-development-data:/var/lib/postgresql/data

  postgres-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: yu_inventory_test
      POSTGRES_PASSWORD: local-migrator-test-password
      POSTGRES_USER: yu_inventory_test_migrator
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yu_inventory_test_migrator -d yu_inventory_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - ./scripts/db/init-test-database.sql:/docker-entrypoint-initdb.d/10-runtime-role.sql:ro
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  postgres-development-data:
