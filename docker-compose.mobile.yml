name: yu-inventory-mobile

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: yu_inventory_dev
      POSTGRES_PASSWORD: local-development-password
      POSTGRES_USER: yu_inventory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yu_inventory -d yu_inventory_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-mobile-data:/var/lib/postgresql/data
      - ./scripts/db/init-mobile-database.sql:/docker-entrypoint-initdb.d/10-runtime-role.sql:ro
    ports:
      - "127.0.0.1:5432:5432"

  init-runtime-role:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: local-development-password
    entrypoint: ["psql"]
    command:
      - -h
      - postgres
      - -U
      - yu_inventory
      - -d
      - yu_inventory_dev
      - -v
      - ON_ERROR_STOP=1
      - -c
      - >-
        DO $$ BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'yu_inventory_runtime') THEN
        CREATE ROLE yu_inventory_runtime LOGIN PASSWORD 'local-runtime-password';
        END IF; END $$;
        GRANT CONNECT ON DATABASE yu_inventory_dev TO yu_inventory_runtime;
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.mobile
      target: migrator
    depends_on:
      init-runtime-role:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://yu_inventory_runtime:local-runtime-password@postgres:5432/yu_inventory_dev
      DATABASE_MIGRATOR_URL: postgresql://yu_inventory:local-development-password@postgres:5432/yu_inventory_dev
      DATABASE_DEPLOYMENT_ID: yu-inventory-local-development
      DATABASE_SSL_MODE: disable
      DATABASE_MIGRATION_LOCK_TIMEOUT_MS: 60000
    command: >-
      sh -c "npm run db:migrate -- --target=development
      && npm run db:smoke -- --target=development"
    restart: "no"

  app:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.mobile
      target: runner
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://yu_inventory_runtime:local-runtime-password@postgres:5432/yu_inventory_dev
      DATABASE_DEPLOYMENT_ID: yu-inventory-local-development
      DATABASE_SSL_MODE: disable
      DATABASE_POOL_MAX: 5
      DATABASE_CONNECTION_TIMEOUT_MS: 5000
      DATABASE_IDLE_TIMEOUT_MS: 30000
      DATABASE_STATEMENT_TIMEOUT_MS: 30000
      YU_DATA_DIRECTORY: /app/.data
      SESSION_COOKIE_SECURE: "true"
      TRUSTED_CLIENT_IP_HEADER: x-real-ip
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-}
    volumes:
      - ./.data:/app/.data
    ports:
      - "127.0.0.1:3000:3000"
    init: true
    stop_grace_period: 35s
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.mobile:/etc/caddy/Caddyfile:ro
      - caddy-mobile-data:/data
      - caddy-mobile-config:/config

volumes:
  postgres-mobile-data:
  caddy-mobile-data:
  caddy-mobile-config:
